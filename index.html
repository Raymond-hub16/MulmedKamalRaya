<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worship Presenter — HKBP Kamal Raya</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --gold-light: #e8cb7a;
      --gold-dim: #7a6330;
      --cream: #f5f0e8;
      --deep: #0d0a06;
      --card: #1e1912;
      --border: rgba(201,168,76,0.2);

      --kj-accent: #c9a84c;
      --kj-accent-light: #e8cb7a;
      --kj-accent-dim: #7a6330;

      --be-accent: #6b9ec4;
      --be-accent-light: #9dc4e0;
      --be-accent-dim: #3a5f7a;

      --bb-accent: #b87979;
      --bb-accent-light: #d9a8a8;
      --bb-accent-dim: #6e4444;
    }

    /* ══════════════════════════════════════
       GLOW MODE — LIGHT BACKGROUND
       ══════════════════════════════════════ */

    /* WHITE background so glow pops on light */
    body.glow-mode { background: #ffffff !important; }
    body.glow-mode::before { display: none; }

    @keyframes orb-float-1 {
      0%,100% { transform: translate(0px, 0px) scale(1); }
      30%      { transform: translate(40px, 30px) scale(1.06); }
      60%      { transform: translate(-30px, 50px) scale(0.96); }
    }
    @keyframes orb-float-2 {
      0%,100% { transform: translate(0px, 0px) scale(1); }
      40%      { transform: translate(-50px, -40px) scale(1.1); }
      75%      { transform: translate(30px, -20px) scale(0.93); }
    }
    @keyframes orb-float-3 {
      0%,100% { transform: translate(0px, 0px) scale(1); }
      50%      { transform: translate(45px, 55px) scale(1.08); }
    }

    .glow-orb {
      display: none;
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    body.glow-mode .glow-orb { display: block; }

    /* KJ — warm gold orbs on white */
    body.glow-mode.kj .glow-orb-1 {
      width: 700px; height: 700px;
      top: -220px; left: calc(50% - 350px);
      background: radial-gradient(circle at center, rgba(201,168,76,0.35) 0%, rgba(201,168,76,0.10) 40%, transparent 70%);
      filter: blur(60px);
      animation: orb-float-1 14s ease-in-out infinite;
    }
    body.glow-mode.kj .glow-orb-2 {
      width: 500px; height: 500px;
      bottom: -120px; right: -100px;
      background: radial-gradient(circle at center, rgba(220,140,40,0.3) 0%, rgba(220,140,40,0.08) 40%, transparent 70%);
      filter: blur(70px);
      animation: orb-float-2 18s ease-in-out infinite;
    }
    body.glow-mode.kj .glow-orb-3 {
      width: 380px; height: 380px;
      top: 40%; left: -80px;
      background: radial-gradient(circle at center, rgba(255,180,50,0.25) 0%, rgba(255,180,50,0.07) 40%, transparent 70%);
      filter: blur(55px);
      animation: orb-float-3 22s ease-in-out infinite;
    }

    /* BE — blue orbs on white */
    body.glow-mode.ende .glow-orb-1 {
      width: 700px; height: 700px;
      top: -220px; left: calc(50% - 350px);
      background: radial-gradient(circle at center, rgba(107,158,196,0.35) 0%, rgba(107,158,196,0.10) 40%, transparent 70%);
      filter: blur(60px);
      animation: orb-float-1 14s ease-in-out infinite;
    }
    body.glow-mode.ende .glow-orb-2 {
      width: 500px; height: 500px;
      bottom: -120px; right: -100px;
      background: radial-gradient(circle at center, rgba(60,120,200,0.3) 0%, rgba(60,120,200,0.08) 40%, transparent 70%);
      filter: blur(70px);
      animation: orb-float-2 18s ease-in-out infinite;
    }
    body.glow-mode.ende .glow-orb-3 {
      width: 380px; height: 380px;
      top: 40%; left: -80px;
      background: radial-gradient(circle at center, rgba(80,160,220,0.22) 0%, rgba(80,160,220,0.06) 40%, transparent 70%);
      filter: blur(55px);
      animation: orb-float-3 22s ease-in-out infinite;
    }

    /* Bibel — crimson orbs on white */
    body.glow-mode.bibel .glow-orb-1 {
      width: 700px; height: 700px;
      top: -220px; left: calc(50% - 350px);
      background: radial-gradient(circle at center, rgba(200,90,90,0.35) 0%, rgba(200,90,90,0.10) 40%, transparent 70%);
      filter: blur(60px);
      animation: orb-float-1 14s ease-in-out infinite;
    }
    body.glow-mode.bibel .glow-orb-2 {
      width: 500px; height: 500px;
      bottom: -120px; right: -100px;
      background: radial-gradient(circle at center, rgba(160,50,50,0.3) 0%, rgba(160,50,50,0.08) 40%, transparent 70%);
      filter: blur(70px);
      animation: orb-float-2 18s ease-in-out infinite;
    }
    body.glow-mode.bibel .glow-orb-3 {
      width: 380px; height: 380px;
      top: 40%; left: -80px;
      background: radial-gradient(circle at center, rgba(220,80,80,0.22) 0%, rgba(220,80,80,0.06) 40%, transparent 70%);
      filter: blur(55px);
      animation: orb-float-3 22s ease-in-out infinite;
    }

    /* ── Cards: glassmorphism on white ── */
    body.glow-mode .verse-card {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    }
    body.glow-mode .verse-card .verse-line { color: #1a1400 !important; }
    body.glow-mode .verse-card .verse-number { color: #7a6330; }

    body.glow-mode.kj   .verse-card:hover  { background: rgba(201,168,76,0.10); border-color: rgba(201,168,76,0.4); box-shadow: 0 0 24px rgba(201,168,76,0.25), 0 2px 16px rgba(0,0,0,0.07); }
    body.glow-mode.ende .verse-card:hover  { background: rgba(107,158,196,0.10); border-color: rgba(107,158,196,0.4); box-shadow: 0 0 24px rgba(107,158,196,0.25), 0 2px 16px rgba(0,0,0,0.07); }
    body.glow-mode.bibel .verse-card:hover { background: rgba(200,90,90,0.10); border-color: rgba(200,90,90,0.4); box-shadow: 0 0 24px rgba(200,90,90,0.25), 0 2px 16px rgba(0,0,0,0.07); }

    body.glow-mode.kj   .verse-card.active { background: rgba(201,168,76,0.12); border-color: rgba(201,168,76,0.7); box-shadow: 0 0 32px rgba(201,168,76,0.35); }
    body.glow-mode.ende .verse-card.active { background: rgba(107,158,196,0.12); border-color: rgba(107,158,196,0.7); box-shadow: 0 0 32px rgba(107,158,196,0.35); }
    body.glow-mode.bibel .verse-card.active { background: rgba(200,90,90,0.12); border-color: rgba(200,90,90,0.7); box-shadow: 0 0 32px rgba(200,90,90,0.35); }

    body.glow-mode .verse-card.reff-card { background: rgba(255,255,255,0.65); border-color: rgba(0,0,0,0.07); }
    body.glow-mode.kj   .verse-card.reff-card { border-color: rgba(201,168,76,0.3); }
    body.glow-mode.ende .verse-card.reff-card { border-color: rgba(107,158,196,0.3); }
    body.glow-mode .verse-card.reff-card .verse-line { color: #5a4010 !important; }

    /* ── Header frosted on white ── */
    body.glow-mode header {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(201,168,76,0.15);
    }

    /* ── Text on white bg — dark with glow ── */
    body.glow-mode .song-title {
      color: #1a1000;
      text-shadow: 0 0 18px rgba(201,168,76,0.55), 0 0 50px rgba(201,168,76,0.20);
    }
    body.glow-mode.ende  .song-title { color: #00111a; text-shadow: 0 0 18px rgba(107,158,196,0.55), 0 0 50px rgba(107,158,196,0.20); }
    body.glow-mode.bibel .song-title { color: #1a0000; text-shadow: 0 0 18px rgba(200,90,90,0.55), 0 0 50px rgba(200,90,90,0.20); }

    body.glow-mode .song-number { color: #7a5a10; text-shadow: 0 0 10px rgba(201,168,76,0.4); }
    body.glow-mode.ende  .song-number { color: #0a3a5a; text-shadow: 0 0 10px rgba(107,158,196,0.4); }
    body.glow-mode.bibel .song-number { color: #6e2a2a; text-shadow: 0 0 10px rgba(200,90,90,0.4); }

    body.glow-mode .logo-text { color: #7a6330; }
    body.glow-mode .tonalitas { color: #7a6330; }

    /* ── FULLSCREEN — WHITE background ── */
    .fullscreen.glow-active { background: #ffffff !important; }

    /* Song lines — dark text with colored glow */
    .fullscreen.glow-active .fs-line {
      color: #1a1200;
      text-shadow:
        0 0 12px rgba(201,168,76,0.7),
        0 0 35px rgba(201,168,76,0.35),
        0 0 70px rgba(201,168,76,0.15);
    }
    .fullscreen.glow-active.ende-mode .fs-line {
      color: #001018;
      text-shadow:
        0 0 12px rgba(107,158,196,0.8),
        0 0 35px rgba(107,158,196,0.4),
        0 0 70px rgba(107,158,196,0.18);
    }
    .fullscreen.glow-active.bibel-mode .fs-line {
      color: #180808;
      text-shadow:
        0 0 12px rgba(200,90,90,0.8),
        0 0 35px rgba(200,90,90,0.4),
        0 0 70px rgba(200,90,90,0.18);
    }
    /* Reff lines on white */
    .fullscreen.glow-active.is-reff .fs-line {
      color: #6a4a00;
      text-shadow:
        0 0 12px rgba(232,203,122,1),
        0 0 35px rgba(232,203,122,0.65),
        0 0 80px rgba(232,203,122,0.25);
    }
    /* Metadata text — readable on white */
    .fullscreen.glow-active .fs-verse-num {
      color: #555;
      text-shadow: none;
    }
    .fullscreen.glow-active .fs-book {
      color: rgba(0,0,0,0.35);
    }
    .fullscreen.glow-active .fs-hint {
      color: rgba(0,0,0,0.22);
    }
    /* Bibel ayat glow on white */
    .fullscreen.glow-active .fs-bibel-verse {
      color: #180808;
      text-shadow:
        0 0 12px rgba(184,121,121,0.6),
        0 0 35px rgba(184,121,121,0.3);
    }
    .fullscreen.glow-active .fs-bibel-verse-num {
      color: #993333;
    }
    /* Perikop label on white */
    .fullscreen.glow-active li[style*="Cinzel"] {
      color: #6e2a2a !important;
    }
    /* Nav arrows on white */
    .fullscreen.glow-active .fs-nav {
      background: rgba(201,168,76,0.08);
      border-color: rgba(201,168,76,0.25);
      color: rgba(100,70,10,0.5);
    }
    .fullscreen.glow-active .fs-nav:hover {
      background: rgba(201,168,76,0.18);
      color: #7a5a10;
    }

    /* ── GLOW TOGGLE BUTTON ── */
    .glow-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 200;
      background: transparent;
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px 7px 10px;
      transition: all 0.3s;
      backdrop-filter: blur(8px);
    }

    .glow-toggle:hover { border-color: rgba(201,168,76,0.5); background: rgba(201,168,76,0.06); }
    body.glow-mode .glow-toggle { border-color: var(--gold); box-shadow: 0 0 16px rgba(201,168,76,0.2); }

    .glow-toggle-track {
      width: 32px; height: 18px;
      background: rgba(255,255,255,0.08);
      border-radius: 9px;
      position: relative;
      transition: background 0.3s;
      flex-shrink: 0;
    }
    body.glow-mode .glow-toggle-track { background: rgba(201,168,76,0.4); }
    body.glow-mode.ende .glow-toggle-track { background: rgba(107,158,196,0.4); }
    body.glow-mode.bibel .glow-toggle-track { background: rgba(184,121,121,0.4); }

    .glow-toggle-thumb {
      width: 12px; height: 12px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      position: absolute;
      top: 3px; left: 3px;
      transition: transform 0.3s, background 0.3s;
    }
    body.glow-mode .glow-toggle-thumb { transform: translateX(14px); background: var(--gold); box-shadow: 0 0 8px var(--gold); }
    body.glow-mode.ende  .glow-toggle-thumb { background: var(--be-accent); box-shadow: 0 0 8px var(--be-accent); }
    body.glow-mode.bibel .glow-toggle-thumb { background: var(--bb-accent); box-shadow: 0 0 8px var(--bb-accent); }

    .glow-toggle-label {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: rgba(201,168,76,0.5);
      text-transform: uppercase;
      transition: color 0.3s;
      white-space: nowrap;
    }
    body.glow-mode .glow-toggle-label { color: var(--gold); }
    body.glow-mode.ende .glow-toggle-label { color: var(--be-accent); }
    body.glow-mode.bibel .glow-toggle-label { color: var(--bb-accent); }

    body {
      font-family: 'EB Garamond', Georgia, serif;
      background: var(--deep);
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,168,76,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(201,168,76,0.04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
      transition: background 0.6s;
    }

    body.ende::before {
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(107,158,196,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(107,158,196,0.04) 0%, transparent 60%);
    }

    body.bibel::before {
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(184,121,121,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(184,121,121,0.04) 0%, transparent 60%);
    }

    header {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      padding: 44px 40px 28px;
      text-align: center;
    }

    .logo-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .logo-line .divider {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
      max-width: 100px;
    }

    .logo-text {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold-dim);
    }

    .book-switcher {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 24px;
    }

    .book-btn {
      background: transparent;
      border: 1px solid var(--gold-dim);
      color: var(--gold-dim);
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      padding: 10px 28px;
      text-transform: uppercase;
      transition: all 0.25s;
      line-height: 1.4;
    }

    .book-btn:first-child { border-radius: 4px 0 0 4px; border-right: none; }
    .book-btn:last-child  { border-radius: 0 4px 4px 0; }
    .book-btn:not(:first-child):not(:last-child) { border-right: none; }

    .book-btn .book-short { display: block; font-size: 13px; font-weight: 600; letter-spacing: 0.05em; margin-bottom: 2px; }
    .book-btn .book-long  { display: block; font-size: 8px; letter-spacing: 0.25em; opacity: 0.7; }

    .book-btn.kj.active {
      background: rgba(201,168,76,0.14);
      border-color: var(--kj-accent);
      color: var(--kj-accent-light);
    }

    .book-btn.ende.active {
      background: rgba(107,158,196,0.14);
      border-color: var(--be-accent);
      color: var(--be-accent-light);
    }

    .book-btn.bibel.active {
      background: rgba(184,121,121,0.14);
      border-color: var(--bb-accent);
      color: var(--bb-accent-light);
    }

    .book-btn:hover:not(.active) {
      background: rgba(255,255,255,0.04);
      border-color: rgba(201,168,76,0.4);
      color: var(--gold-dim);
    }

    .search-area {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .search-area.hidden { display: none; }

    .label {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.25em;
      color: var(--gold-dim);
      text-transform: uppercase;
      white-space: nowrap;
      transition: color 0.3s;
    }

    body.ende .label { color: var(--be-accent-dim); }
    body.bibel .label { color: var(--bb-accent-dim); }

    .song-input {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--gold-light);
      font-family: 'Cinzel', serif;
      font-size: 18px;
      letter-spacing: 0.1em;
      padding: 10px 16px;
      width: 100px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s, color 0.3s;
    }

    .song-input:focus { border-color: var(--gold); }
    body.ende .song-input { color: var(--be-accent-light); }
    body.ende .song-input:focus { border-color: var(--be-accent); }

    .fetch-btn {
      background: transparent;
      border: 1px solid var(--gold-dim);
      border-radius: 4px;
      color: var(--gold);
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.25em;
      padding: 11px 22px;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .fetch-btn:hover { background: rgba(201,168,76,0.1); border-color: var(--gold); }
    body.ende .fetch-btn { border-color: var(--be-accent-dim); color: var(--be-accent); }
    body.ende .fetch-btn:hover { background: rgba(107,158,196,0.1); border-color: var(--be-accent); }
    body.bibel .fetch-btn { border-color: var(--bb-accent-dim); color: var(--bb-accent); }
    body.bibel .fetch-btn:hover { background: rgba(184,121,121,0.1); border-color: var(--bb-accent); }

    .bibel-area {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .bibel-area.show { display: flex; }

    .lang-toggle {
      display: flex;
      gap: 0;
    }

    .lang-btn {
      background: transparent;
      border: 1px solid var(--bb-accent-dim);
      color: var(--bb-accent-dim);
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 0.3em;
      padding: 7px 18px;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .lang-btn:first-child { border-radius: 3px 0 0 3px; border-right: none; }
    .lang-btn:last-child  { border-radius: 0 3px 3px 0; }
    .lang-btn.active {
      background: rgba(184,121,121,0.18);
      border-color: var(--bb-accent);
      color: var(--bb-accent-light);
    }
    .lang-btn:hover:not(.active) {
      background: rgba(255,255,255,0.04);
      color: var(--bb-accent);
    }

    .bibel-row {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .book-select {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--bb-accent-light);
      font-family: 'EB Garamond', serif;
      font-size: 15px;
      padding: 10px 14px;
      min-width: 220px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .book-select:focus { border-color: var(--bb-accent); }
    .book-select option { background: var(--card); color: var(--cream); }

    .verse-input {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--bb-accent-light);
      font-family: 'Cinzel', serif;
      font-size: 15px;
      letter-spacing: 0.08em;
      padding: 10px 14px;
      width: 130px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    .verse-input:focus { border-color: var(--bb-accent); }
    .verse-input::placeholder { color: var(--bb-accent-dim); opacity: 0.6; }

    .hint-text {
      font-size: 11px;
      color: var(--bb-accent-dim);
      font-style: italic;
      opacity: 0.7;
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      padding: 0 40px 80px;
    }

    .song-title-area {
      text-align: center;
      margin-bottom: 44px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.5s, transform 0.5s;
    }

    .song-title-area.visible { opacity: 1; transform: translateY(0); }

    .book-badge {
      display: inline-block;
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 0.35em;
      padding: 3px 12px;
      border-radius: 3px;
      margin-bottom: 14px;
      text-transform: uppercase;

    body.classList.toggle('ende',  mode === 'ende');
    body.classList.toggle('bibel', mode === 'bibel');

    btnKJ.classList.toggle('active',    mode === 'kj');
    btnEnde.classList.toggle('active',  mode === 'ende');
    btnBibel.classList.toggle('active', mode === 'bibel');

    if (mode === 'bibel') {
      songSearch.classList.add('hidden');
      bibelSearch.classList.add('show');
    } else {
      songSearch.classList.remove('hidden');
      bibelSearch.classList.remove('show');
      labelBook.textContent = BOOKS[mode].inputLabel;
    }

    resetDisplay();
  }

  function switchLang(lang) {
    if (currentLang === lang) return;
    currentLang = lang;
    langToba.classList.toggle('active', lang === 'toba');
    langTb.classList.toggle('active',   lang === 'tb');
  }

  function resetDisplay() {
    titleArea.classList.remove('visible');
    versesGrid.innerHTML = '';
    presentBtn.classList.remove('show');
    kbHint.style.display = 'none';
    status.className = 'status';
    verses = [];
    currentVerse = 0;
  }

  function showStatus(msg, isError = false) {
    status.innerHTML = isError ? msg : `<div class="spinner"></div>${msg}`;
    status.className = 'status show' + (isError ? ' error' : '');
  }

  function hideStatus() { status.className = 'status'; }

  async function fetchJSON(url) {
    if (cache.has(url)) return cache.get(url);
    activeController?.abort();
    activeController = new AbortController();
    const res = await fetch(url, { signal: activeController.signal });
    if (!res.ok) throw new Error(`Tidak ditemukan (${res.status})`);
    const data = await res.json();
    cache.set(url, data);
    return data;
  }

  function buildVerseOrder(raw) {
    const reff      = raw.find(v => v.type === 'reff') || null;
    const verseOnly = raw.filter(v => v.type !== 'reff');
    if (!verseOnly.length) return raw;
    const result = [];
    verseOnly.forEach(v => {
      result.push(v);
      if (reff) result.push({ ...reff });
    });
    return result;
  }

  async function fetchSong() {
    const num = parseInt(songInput.value, 10);
    if (!num || num < 1) { showStatus('Nomor lagu tidak valid', true); return; }

    resetDisplay();
    showStatus('Memuat lirik...');

    const book = BOOKS[currentMode];

    try {
      const data = await fetchJSON(book.api + num);

      bookBadge.className = `book-badge ${currentMode}`;
      bookBadge.textContent = book.full;
      songNumber.textContent = `${book.label} ${data.nomorLagu}`;
      songTitle.textContent  = data.judul || `${book.label} ${data.nomorLagu}`;
      tonalitas.textContent  = data.tonalitas ? `Nada dasar: ${data.tonalitas}` : '';

      const raw = (data.lirik || []).filter(v => v.lines && v.lines.length);
      if (!raw.length) throw new Error('Lirik tidak tersedia untuk lagu ini.');

      verses = buildVerseOrder(raw);
      hideStatus();
      setTimeout(() => titleArea.classList.add('visible'), 50);

      renderSongCards();
      presentBtn.classList.add('show');
      kbHint.style.display = 'block';

    } catch (err) {
      if (err.name === 'AbortError') return;
      showStatus(err.message, true);
    }
  }

  function renderSongCards() {
    let verseCounter = 0;
    verses.forEach((verse, i) => {
      const isReff = verse.type === 'reff';
      if (!isReff) verseCounter++;

      const card = document.createElement('div');
      card.className = 'verse-card' + (isReff ? ' reff-card' : '');
      card.dataset.index = i;

      const label = document.createElement('div');
      label.className = 'verse-number';
      label.textContent = isReff ? 'Refrein' : `Bait ${verseCounter}`;

      const ul = document.createElement('ul');
      ul.className = 'verse-lines';
      verse.lines.forEach(line => {
        const li = document.createElement('li');
        li.className = 'verse-line';
        li.textContent = line;
        ul.appendChild(li);
      });

      card.appendChild(label);
      card.appendChild(ul);
      versesGrid.appendChild(card);

      setTimeout(() => card.classList.add('visible'), 100 + i * 70);

      card.addEventListener('click', () => {
        document.querySelectorAll('.verse-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        currentVerse = i;
      });
    });
  }

  function parseRef(ref) {
    ref = (ref || '').trim();
    if (!ref) return null;

    const m1 = ref.match(/^(\d+)\s*:\s*(\d+)(?:\s*[-–]\s*(\d+))?$/);
    if (m1) {
      const ch = +m1[1], from = +m1[2], to = m1[3] ? +m1[3] : from;
      if (ch < 1 || from < 1 || to < from) return null;
      return { chapter: ch, fromV: from, toV: to };
    }

    const m2 = ref.match(/^(\d+)$/);
    if (m2) {
      const ch = +m2[1];
      if (ch < 1) return null;
      return { chapter: ch, fromV: null, toV: null };
    }

    return null;
  }

  function buildBibelSlides(rawVerses, fromV, toV) {
    const contentVerses = rawVerses.filter(v => v.type === 'content');
    const titleVerses   = rawVerses.filter(v => v.type === 'title');

    const titleByVerse = new Map();
    titleVerses.forEach(t => {
      if (!titleByVerse.has(t.verse)) titleByVerse.set(t.verse, []);
      titleByVerse.get(t.verse).push(t.text);
    });

    const filtered = (fromV == null)
      ? contentVerses
      : contentVerses.filter(v => v.verse >= fromV && v.verse <= toV);

    if (!filtered.length) return [];

    const slides = [];
    let buffer = [];
    let bufferPerikop = null;

    filtered.forEach((v, idx) => {
      const titles = titleByVerse.get(v.verse);
      if (titles && titles.length) {
        if (buffer.length) {
          slides.push({ perikop: bufferPerikop, items: buffer });
          buffer = [];
          bufferPerikop = null;
        }
        bufferPerikop = titles.join(' / ');
      }

      buffer.push({ verse: v.verse, text: v.text });

      if (buffer.length >= VERSES_PER_SLIDE) {
        slides.push({ perikop: bufferPerikop, items: buffer });
        buffer = [];
        bufferPerikop = null;
      }
    });

    if (buffer.length) slides.push({ perikop: bufferPerikop, items: buffer });
    return slides;
  }

  async function fetchBibel() {
    const bookIdx = parseInt(bookSelect.value, 10);
    const book = BIBLE_BOOKS[bookIdx];
    if (!book) { showStatus('Kitab tidak valid', true); return; }

    const parsed = parseRef(verseInput.value);
    if (!parsed) {
      showStatus('Format ayat tidak valid. Gunakan: <b>1:1-5</b> atau <b>1:1</b> atau <b>1</b>', true);
      return;
    }

    resetDisplay();
    showStatus('Memuat ayat...');

    const langDir = currentLang;
    const url = `${BIBEL_API}/${book.abbr}/${parsed.chapter}?ver=${langDir}`;

    try {
      const raw = await fetchJSON(url);

      const normalized = (raw.data?.verses || raw.verses || []).map(v => ({
        verse: v.verse,
        text:  v.content || v.text || '',
        type:  v.type === 'title' ? 'title' : 'content'
      }));
      const data = { verses: normalized };

      const slides = buildBibelSlides(data.verses || [], parsed.fromV, parsed.toV);
      if (!slides.length) {
        throw new Error('Ayat tidak ditemukan dalam pasal ini.');
      }

      verses = slides;
      currentVerse = 0;

      bookBadge.className = 'book-badge bibel';
      bookBadge.textContent = currentLang === 'toba' ? 'Bibel (Toba)' : 'Alkitab (Indonesia)';

      const displayBookName = currentLang === 'toba' ? book.tobaLabel : book.tbName;
      const rangeStr = (parsed.fromV == null)
        ? `Pasal ${parsed.chapter}`
        : (parsed.fromV === parsed.toV
            ? `${parsed.chapter}:${parsed.fromV}`
            : `${parsed.chapter}:${parsed.fromV}-${parsed.toV}`);

      songNumber.textContent = rangeStr;
      songTitle.textContent  = displayBookName;
      tonalitas.textContent  = currentLang === 'toba'
        ? `${book.tbName} · ${data.verses.length} ayat`
        : `${book.tobaLabel} (Toba)`;

      hideStatus();
      setTimeout(() => titleArea.classList.add('visible'), 50);

      renderBibelCards();
      presentBtn.classList.add('show');
      kbHint.style.display = 'block';

    } catch (err) {
      if (err.name === 'AbortError') return;
      showStatus(err.message, true);
    }
  }

  function renderBibelCards() {
    verses.forEach((slide, i) => {
      const card = document.createElement('div');
      card.className = 'verse-card';
      card.dataset.index = i;

      const label = document.createElement('div');
      label.className = 'verse-number';
      const first = slide.items[0].verse;
      const last  = slide.items[slide.items.length - 1].verse;
      label.textContent = `Slide ${i + 1} · Ayat ${first}${first !== last ? '-' + last : ''}`;

      card.appendChild(label);

      if (slide.perikop) {
        const p = document.createElement('div');
        p.className = 'perikop-text';
        p.style.cssText = 'font-family:Cinzel,serif;font-size:11px;letter-spacing:0.18em;color:var(--bb-accent-light);text-transform:uppercase;font-weight:600;margin-bottom:12px;line-height:1.5;';
        p.textContent = slide.perikop;
        card.appendChild(p);
      }

      slide.items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'bibel-verse';
        const sup = document.createElement('span');
        sup.className = 'bibel-verse-num';
        sup.textContent = item.verse;
        div.appendChild(sup);
        div.appendChild(document.createTextNode(item.text));
        card.appendChild(div);
      });

      versesGrid.appendChild(card);
      setTimeout(() => card.classList.add('visible'), 100 + i * 70);

      card.addEventListener('click', () => {
        document.querySelectorAll('.verse-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        currentVerse = i;
      });
    });
  }

  function openFullscreen(index) {
    currentVerse = index;
    renderFsVerse();
    fullscreen.classList.add('open');
    fullscreen.classList.toggle('glow-active', glowActive);
  }

  function closeFull() { fullscreen.classList.remove('open'); }

  function renderFsVerse() {
    const v = verses[currentVerse];
    if (!v) return;

    fullscreen.classList.toggle('ende-mode',  currentMode === 'ende');
    fullscreen.classList.toggle('bibel-mode', currentMode === 'bibel');

    if (currentMode === 'bibel') {
      renderFsBibel(v);
    } else {
      renderFsSong(v);
    }

    document.querySelectorAll('.verse-card').forEach(c => {
      c.classList.toggle('active', +c.dataset.index === currentVerse);
    });
  }

  function renderFsSong(v) {
    const isReff = v.type === 'reff';
    const book   = BOOKS[currentMode];

    let vNum = 0;
    for (let i = 0; i <= currentVerse; i++) {
      if (verses[i].type !== 'reff') vNum++;
    }

    fsBook.textContent     = book.full;
    fsVerseNum.textContent = isReff
      ? `Refrein · ${currentVerse + 1} / ${verses.length}`
      : `Bait ${vNum} · ${currentVerse + 1} / ${verses.length}`;

    fullscreen.classList.toggle('is-reff', isReff);

    fsLines.innerHTML = '';
    v.lines.forEach(line => {
      const li = document.createElement('li');
      li.className = 'fs-line';
      li.textContent = line;
      fsLines.appendChild(li);
    });
  }

  function renderFsBibel(slide) {
    fullscreen.classList.remove('is-reff');

    const bookIdx = parseInt(bookSelect.value, 10);
    const book = BIBLE_BOOKS[bookIdx];
    const displayBookName = currentLang === 'toba' ? book.tobaLabel : book.tbName;
    const first = slide.items[0].verse;
    const last  = slide.items[slide.items.length - 1].verse;
    const parsed = parseRef(verseInput.value);
    const ch = parsed?.chapter || 1;

    fsBook.textContent = currentLang === 'toba' ? 'Bibel · Toba' : 'Alkitab · Indonesia';
    fsVerseNum.textContent = `${displayBookName} ${ch}:${first}${first !== last ? '-' + last : ''} · ${currentVerse + 1} / ${verses.length}`;

    fsLines.innerHTML = '';

    if (slide.perikop) {
      const li = document.createElement('li');
      li.style.cssText = 'font-family:Cinzel,serif;font-size:clamp(12px,1.4vw,18px);letter-spacing:0.2em;color:var(--bb-accent-light);text-transform:uppercase;font-weight:600;margin-bottom:28px;line-height:1.5;text-align:center;';
      li.textContent = slide.perikop;
      fsLines.appendChild(li);
    }

    slide.items.forEach(item => {
      const li = document.createElement('li');
      li.className = 'fs-bibel-verse';
      const sup = document.createElement('span');
      sup.className = 'fs-bibel-verse-num';
      sup.textContent = item.verse;
      li.appendChild(sup);
      li.appendChild(document.createTextNode(item.text));
      fsLines.appendChild(li);
    });
  }

  function fsPrevVerse() { if (currentVerse > 0) { currentVerse--; renderFsVerse(); } }
  function fsNextVerse() { if (currentVerse < verses.length - 1) { currentVerse++; renderFsVerse(); } }

  fetchBtn.addEventListener('click', fetchSong);
  bibelFetchBtn.addEventListener('click', fetchBibel);
  songInput.addEventListener('keydown',  e => { if (e.key === 'Enter') fetchSong(); });
  verseInput.addEventListener('keydown', e => { if (e.key === 'Enter') fetchBibel(); });

  presentBtn.addEventListener('click', () => openFullscreen(currentVerse));
  fsPrev.addEventListener('click', e => { e.stopPropagation(); fsPrevVerse(); });
  fsNext.addEventListener('click', e => { e.stopPropagation(); fsNextVerse(); });
  fullscreen.addEventListener('click', e => {
    if (e.target === fullscreen || e.target === fsLines || e.target === fsBook || e.target === fsVerseNum) closeFull();
  });

  document.addEventListener('keydown', e => {
    if (fullscreen.classList.contains('open')) {
      if (e.key === 'ArrowLeft')  fsPrevVerse();
      if (e.key === 'ArrowRight') fsNextVerse();
      if (e.key === 'Escape')     closeFull();
    } else {
      const inInput = document.activeElement === songInput
                    || document.activeElement === verseInput
                    || document.activeElement === bookSelect;
      if ((e.key === 'f' || e.key === 'F') && !inInput && verses.length) {
        openFullscreen(currentVerse);
      }
    }
  });

  let glowActive = false;

  document.getElementById('glowToggle').addEventListener('click', () => {
    glowActive = !glowActive;
    body.classList.toggle('glow-mode', glowActive);
    fullscreen.classList.toggle('glow-active', glowActive);
  });

  fetchSong();
</script>
</body>
